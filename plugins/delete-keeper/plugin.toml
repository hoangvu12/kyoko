id = "kyoko.delete-keeper"
name = "Delete Keeper"
version = "0.1.0"
api = "^1.0"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Keeps the text of deleted messages and shows it under a deleted badge."
entry = "delete_keeper.wasm"
min_host = "0.1.0"

[[permissions]]
permission = "context-timeline"
reason = "Sees messages as they are created, edited and deleted."

[[permissions]]
permission = "storage"
reason = "Keeps the last text of recent messages."

[[permissions]]
permission = "ui-slots"
reason = "Shows the kept text of deleted messages."
