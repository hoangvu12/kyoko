id = "kyoko.edit-history"
name = "Edit History"
version = "0.1.0"
api = "^1.0"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Keeps the previous versions of edited messages and shows them under the message."
entry = "edit_history.wasm"
min_host = "0.1.0"

[[permissions]]
permission = "context-timeline"
reason = "Sees messages as they are created and edited."

[[permissions]]
permission = "storage"
reason = "Keeps the text of recent messages and their earlier versions."

[[permissions]]
permission = "message-render"
reason = "Shows the earlier versions under an edited message."
