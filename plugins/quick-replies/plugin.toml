id = "kyoko.quick-replies"
name = "Quick Replies"
version = "0.1.0"
api = "^1.0"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Saved snippets you can send from a composer popover or with /snip <name>."
entry = "quick_replies.wasm"
min_host = "0.1.0"

[[permissions]]
permission = "ui-slots"
reason = "Adds the composer button, the snippet popover and the /snip command."

[[permissions]]
permission = "storage"
reason = "Keeps your snippets."

[[permissions]]
permission = "actions-send"
reason = "Sends the snippet you pick."

[[permissions]]
permission = "context-basic"
reason = "Finds the channel the composer button belongs to."
