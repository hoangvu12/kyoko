id = "kyoko.word-mute"
name = "Word Mute"
version = "0.1.0"
api = "^1.0"
authors = ["fate"]
license = "MIT OR Apache-2.0"
description = "Hides messages that contain words or phrases you muted, for spoilers and noise."
entry = "word_mute.wasm"
min_host = "0.1.0"

[[permissions]]
permission = "message-filter"
reason = "Hides messages that contain a muted word or phrase."

[[permissions]]
permission = "storage"
reason = "Keeps your muted words."

[[permissions]]
permission = "ui-slots"
reason = "Adds the muted words page in settings and the /mute, /unmute, /mutes and /unmuteall commands."

[[permissions]]
permission = "context-basic"
reason = "Tells your own messages apart so they are never hidden."
