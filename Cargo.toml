[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/*"]
exclude = ["tools/parity"]

[workspace.package]
version = "0.2.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hoangvu12/kyoko"
rust-version = "1.99"

[workspace.dependencies]
protocol = { path = "crates/protocol", package = "kyoko-protocol" }
rest = { path = "crates/rest", package = "kyoko-rest" }
gateway = { path = "crates/gateway", package = "kyoko-gateway" }
state = { path = "crates/state", package = "kyoko-state" }
store = { path = "crates/store", package = "kyoko-store" }
markdown = { path = "crates/markdown", package = "kyoko-markdown" }
platform = { path = "crates/platform", package = "kyoko-platform" }
media = { path = "crates/media", package = "kyoko-media" }
session = { path = "crates/session", package = "kyoko-session" }
login = { path = "crates/login", package = "kyoko-login" }
mockcord = { path = "tools/mockcord" }
bridge = { path = "crates/bridge", package = "kyoko-bridge" }

zgx = { git = "https://github.com/zeronsh/zgx", rev = "fc7d0f1e6695b2153bc0e18f0f1a3cef6f0426f6" }
zgx-desktop = { git = "https://github.com/zeronsh/zgx", rev = "fc7d0f1e6695b2153bc0e18f0f1a3cef6f0426f6" }
zgx-script = { git = "https://github.com/zeronsh/zgx", rev = "fc7d0f1e6695b2153bc0e18f0f1a3cef6f0426f6" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "multipart", "gzip", "brotli", "zstd", "http2", "cookies"] }
cookie_store = { version = "0.22", default-features = false, features = ["serde_json"] }
uuid = { version = "1.28", features = ["v4"] }
iana-time-zone = "0.1"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2"
flate2 = "1.1"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
bitflags = { version = "2.13", features = ["serde"] }
bytes = "1"
url = "2"
rustls = "0.23"
rand = "0.9"
parking_lot = "0.12"
indexmap = { version = "2", features = ["serde"] }
smallvec = "1"
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8", features = ["ws", "json", "macros"] }
sha2 = "0.10"
rsa = "0.9"
qrcode = { version = "0.14", default-features = false }
wry = "0.57"
tao = "0.37"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
directories = "6.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
fast_image_resize = "6.1"
blurhash = "0.2"
thumbhash = "0.1"
lru = "0.19"
base64 = "0.23"
interprocess = { version = "2.4", features = ["tokio"] }
notify-rust = "4.18"
tray-icon = { version = "0.26", default-features = false }
auto-launch = "0.6"
arboard = "3.7"
global-hotkey = "0.9"
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_System_Registry",
	"Win32_System_SystemInformation",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
	"Wdk_System_SystemServices",
] }

toml = "1.1"
ed25519-dalek = "3.0"

clap = { version = "4.6", features = ["derive"] }
embed-resource = "3.0"

aes-gcm = { version = "0.11", features = ["hazmat"] }
chacha20poly1305 = "0.11"

[patch.crates-io]
wgpu-hal = { git = "https://github.com/zeronsh/zgx", rev = "fc7d0f1e6695b2153bc0e18f0f1a3cef6f0426f6" }
cosmic-text = { git = "https://github.com/zeronsh/zgx", rev = "fc7d0f1e6695b2153bc0e18f0f1a3cef6f0426f6" }
taffy = { git = "https://github.com/zeronsh/zgx", rev = "fc7d0f1e6695b2153bc0e18f0f1a3cef6f0426f6" }
accesskit_macos = { git = "https://github.com/zeronsh/zgx", rev = "fc7d0f1e6695b2153bc0e18f0f1a3cef6f0426f6" }
accesskit_atspi_common = { git = "https://github.com/zeronsh/zgx", rev = "fc7d0f1e6695b2153bc0e18f0f1a3cef6f0426f6" }
accesskit_unix = { git = "https://github.com/zeronsh/zgx", rev = "fc7d0f1e6695b2153bc0e18f0f1a3cef6f0426f6" }
accesskit_windows = { git = "https://github.com/zeronsh/zgx", rev = "fc7d0f1e6695b2153bc0e18f0f1a3cef6f0426f6" }
winit = { git = "https://github.com/zeronsh/zgx", rev = "fc7d0f1e6695b2153bc0e18f0f1a3cef6f0426f6" }
mlua = { git = "https://github.com/zeronsh/zgx", rev = "fc7d0f1e6695b2153bc0e18f0f1a3cef6f0426f6" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

