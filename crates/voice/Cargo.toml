[package]
name = "kyoko-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "voice"

[features]
openh264 = ["dep:openh264"]

[dependencies]
protocol.workspace = true
net.workspace = true
tokio.workspace = true
futures-util.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
parking_lot.workspace = true
url.workspace = true
uuid.workspace = true
opus.workspace = true
rubato.workspace = true
denoise.workspace = true
sonora.workspace = true
aes-gcm.workspace = true
chacha20poly1305.workspace = true
cpal.workspace = true
dave.workspace = true
video.workspace = true
openh264 = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = [
	"Win32_Foundation",
	"Win32_Media_Audio",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Threading",
	"Win32_System_Variant",
] }

[dev-dependencies]
denoise = { workspace = true, features = ["testing"] }
mockcord = { workspace = true, features = ["tls"] }
dave = { workspace = true, features = ["testing"] }
openmls.workspace = true
tls_codec.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
	"Foundation",
	"Graphics_Capture",
	"Win32_Media_MediaFoundation",
	"Win32_System_Com",
] }
