name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kyoko") | .version')"
          if [ "$version" != "$crate_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match crate version $crate_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: verify
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p kyoko --target x86_64-pc-windows-msvc
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Package
        shell: pwsh
        run: |
          $binary = "$PWD\target\x86_64-pc-windows-msvc\release\kyoko.exe"
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          $core = $env:VERSION.Split('-')[0].Split('+')[0]
          makensis /V2 "/DVERSION=$env:VERSION" "/DVERSION_QUAD=$core.0" "/DBINARY=$binary" "/DOUTFILE=$PWD\dist\kyoko-$env:VERSION-windows-x86_64-installer.exe" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $binary stage\kyoko.exe
          Copy-Item LICENSE-MIT, LICENSE-APACHE stage\
          Compress-Archive -Path stage\* -DestinationPath "dist\kyoko-$env:VERSION-windows-x86_64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x86_64
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Notes
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          cargo xtask release notes ${previous:+--since "$previous"} --out notes.md
      - name: Release
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
