[graph]
all-features = false

[advisories]
version = 2
ignore = [
	{ id = "RUSTSEC-2023-0071", reason = "no patched rsa release exists, used only for the one-off QR login key exchange, never as a network oracle" },
]
unmaintained = "workspace"

[licenses]
version = 2
allow = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"Unicode-3.0",
	"Unicode-DFS-2016",
	"MPL-2.0",
	"CC0-1.0",
	"Unlicense",
	"OpenSSL",
	"BSL-1.0",
	"0BSD",
	"CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/zeronsh/zgui"]
