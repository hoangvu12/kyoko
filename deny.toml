[graph]
all-features = false

[advisories]
version = 2
ignore = [
	{ id = "RUSTSEC-2023-0071", reason = "no patched rsa release exists, used only for the one-off QR login key exchange, never as a network oracle" },
	{ id = "RUSTSEC-2026-0391", reason = "zstd 0.13 comes only from the pinned wreq-util, whose zstd certificate compressor only Firefox profiles use; kyoko's Chrome profile offers brotli only" },
	{ id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 comes only from the pinned wreq-util, whose zstd certificate compressor only Firefox profiles use; kyoko's Chrome profile offers brotli only" },
	{ id = "RUSTSEC-2026-0403", reason = "zstd-safe 7 comes only from the pinned wreq-util, whose zstd certificate compressor only Firefox profiles use; kyoko's Chrome profile offers brotli only" },
	{ id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 has no fixed release; it comes from p256/p384 0.13 under openmls in the unlinked voice trial crate and str0m in xtask's localhost capture; decide before voice ships (docs/fingerprint.md, Voice)" },
]
unmaintained = "workspace"

[licenses]
version = 2
allow = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"Unicode-3.0",
	"Unicode-DFS-2016",
	"MPL-2.0",
	"CC0-1.0",
	"Unlicense",
	"OpenSSL",
	"BSL-1.0",
	"0BSD",
	"CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
	"https://github.com/zeronsh/zgx",
	"https://github.com/0x676e67/wreq",
	"https://github.com/0x676e67/wreq-util",
	"https://github.com/0x676e67/btls",
]
